<dx-data-grid [hidden]="showNoRecords || showNoService ||(userData?.roleName != 'HR') || this.showGrid" id="gridContainer" [dataSource]="dataSource" [columns]="columns" [showBorders]="true" 
[showColumnLines]="true" [showRowLines]="true" [columnAutoWidth]="true" [rowAlternationEnabled]="true"  (onContextMenuPreparing)="onRightClick($event)">
<dxo-paging [pageSize]="10"> </dxo-paging>
<dxo-pager
  [visible]="true"
  [displayMode]="displayMode"
  [showPageSizeSelector]="showPageSizeSelector"
  [showInfo]="showInfo"
  [showNavigationButtons]="showNavButtons"
>
</dxo-pager>
</dx-data-grid>

<div class="wrapper-main" *ngIf="showNoRecords">
   <section class="no-records">
       <img class="mb-3" src="assets/icons/icon-no-record.svg">
       <div style="clear:both;"></div>
       <span>{{'No records to display'}}</span>
   </section>
</div>
<div class="wrapper-main noRecords-Todisplay" *ngIf="showNoService">
   <section class="no-records">
       <span>{{"Not available at the moment"}}</span>
   </section>
</div>
